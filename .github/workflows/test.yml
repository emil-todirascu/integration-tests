name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-fork:
    name: "Karma fork emil-todirascu/karma@master (Node 22)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: browser-actions/setup-firefox@v1

      - name: Checkout Karma fork
        uses: actions/checkout@v4
        with:
          repository: emil-todirascu/karma
          ref: master
          path: karma-src

      - name: Pack Karma tarball
        working-directory: karma-src
        run: |
          set -euo pipefail
          npm pack
          TARBALL="$(ls -1 *.tgz | head -n1)"
          echo "KARMA_TARBALL=$PWD/$TARBALL" >> "$GITHUB_ENV"
          echo "Using tarball: $PWD/$TARBALL"

      - name: Run integration tests against fork tarball
        run: bash run.sh "$KARMA_TARBALL"
